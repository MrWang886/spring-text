<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="userCommon::common-header">
    <style>
        /* 新增自定义样式 */
        .profile-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .info-table {
            border-collapse: separate;
            border-spacing: 0 15px;
        }

        .info-table td {
            padding: 1.2rem;
            vertical-align: middle;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .info-table td:first-child {
            width: 35%;
            font-weight: 500;
            color: #6c757d;
            background: rgba(108,117,125,0.05);
        }

        .discussion-card {
            border-left: 4px solid #0d6efd;
            transition: all 0.3s ease;
        }

        .discussion-card:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(13,110,253,0.15);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            color: white;
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(13,110,253,0.3);
        }

        .welcome-alert {
            border-left: 4px solid #198754;
            border-radius: 8px;
        }
    </style>
</head>
<body class="sb-nav-fixed">
<nav th:replace="userCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="userCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <!-- 欢迎提示 -->
                <div class="alert alert-success alert-dismissible fade show mt-4 welcome-alert" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-smile-beam me-3 fs-4"></i>
                        <div>
                            <h4 class="alert-heading mb-1">欢迎回来，<span th:text="${member.memberName}" class="fw-bold"></span>！</h4>
                            <p class="mb-0">今天是您加入的第 <span class="text-primary">365</span> 天</p>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- 面包屑导航 -->
                <nav aria-label="breadcrumb" class="mt-4">
                    <ol class="breadcrumb bg-light p-3 rounded-3">
                        <li class="breadcrumb-item"><a th:href="@{/toUserMain}" class="text-decoration-none">主页</a></li>
                        <li class="breadcrumb-item active text-primary">个人信息</li>
                    </ol>
                </nav>

                <div class="row g-4">
                    <!-- 个人信息卡片 -->
                    <div class="col-lg-8">
                        <div class="card profile-card mb-4">
                            <div class="card-header bg-transparent">
                                <h3 class="card-title mb-0">
                                    <i class="fas fa-id-card me-2 text-primary"></i>
                                    个人档案
                                </h3>
                            </div>
                            <div class="card-body">
                                <table class="table info-table">
                                    <tbody>
                                    <tr>
                                        <td>会员账号/卡号</td>
                                        <td class="fw-bold" th:text="${member.memberAccount}"></td>
                                    </tr>
                                    <tr>
                                        <td>姓名</td>
                                        <td class="fw-bold" th:text="${member.memberName}"></td>
                                    </tr>
                                    <tr>
                                        <td>性别</td>
                                        <td th:text="${member.memberGender}"></td>
                                    </tr>
                                    <tr>
                                        <td>年龄</td>
                                        <td th:text="${member.memberAge}"></td>
                                    </tr>
                                    <tr>
                                        <td>联系方式</td>
                                        <td th:text="${member.memberPhone}"></td>
                                    </tr>
                                    <tr>
                                        <td>身体数据</td>
                                        <td>
                                            <div class="d-flex gap-3">
                                                <div class="text-center">
                                                    <div class="text-muted small">身高</div>
                                                    <div class="h5 mb-0" th:text="${member.memberHeight}+'cm'"></div>
                                                </div>
                                                <div class="vr"></div>
                                                <div class="text-center">
                                                    <div class="text-muted small">体重</div>
                                                    <div class="h5 mb-0" th:text="${member.memberWeight}+'kg'"></div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>会员有效期</td>
                                        <td th:text="${member.cardTime}"></td>
                                    </tr>
                                    <tr>
                                        <td>剩余课时</td>
                                        <td>
                                                <span class="badge bg-primary rounded-pill fs-6"
                                                      th:text="${member.cardNextClass}"></span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div class="text-center mt-4">
                                    <a th:href="@{/user/toUpdateInfo}" class="gradient-btn">
                                        <i class="fas fa-edit me-2"></i>编辑个人信息
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 讨论区卡片 -->
                    <div class="col-lg-4">
                        <div class="card discussion-card h-100">
                            <div class="card-header bg-transparent">
                                <h3 class="card-title mb-0">
                                    <i class="fas fa-comments me-2 text-primary"></i>
                                    健身交流社区
                                </h3>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <div class="mb-4">
                                    <p class="text-muted">热门讨论分类：</p>
                                    <div class="list-group">
                                        <a href="#" class="list-group-item list-group-item-action">
                                            <div class="d-flex align-items-center">
                                                <i class="fas fa-question-circle me-3 text-primary"></i>
                                                <div>
                                                    <h6 class="mb-1">常见问题解答</h6>
                                                    <small class="text-muted">查看高频提问指南</small>
                                                </div>
                                            </div>
                                        </a>
                                        <a href="#" class="list-group-item list-group-item-action">
                                            <div class="d-flex align-items-center">
                                                <i class="fas fa-user-plus me-3 text-primary"></i>
                                                <div>
                                                    <h6 class="mb-1">新手指南</h6>
                                                    <small class="text-muted">了解社区使用规范</small>
                                                </div>
                                            </div>
                                        </a>
                                        <a href="#" class="list-group-item list-group-item-action">
                                            <div class="d-flex align-items-center">
                                                <i class="fas fa-comment-dots me-3 text-primary"></i>
                                                <div>
                                                    <h6 class="mb-1">讨论区指南</h6>
                                                    <small class="text-muted">查看优质发帖示例</small>
                                                </div>
                                            </div>
                                        </a>
                                    </div>
                                </div>
                                </div>
                                <a th:href="@{/discussion/list}" class="gradient-btn mt-auto">
                                    <i class="fas fa-comments me-2"></i>进入讨论区
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="userCommon::common-footer"></footer>
    </div>
</div>

<div th:include="userCommon::common-scripts"></div>
</body>
</html>
