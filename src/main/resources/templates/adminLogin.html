    <!DOCTYPE html>
    <html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <meta name="description" content="gym-management-system"/>
        <meta name="author" content="MiloTnT"/>
        <title>健身房管理系统-管理员登录</title>
        <link href="/static/css/styles.css" th:href="@{css/styles.css}" rel="stylesheet"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
        <style>
            /* 自定义样式 */
            .auth-container {
                background: linear-gradient(135deg, rgba(16, 36, 94, 0.9), rgba(3, 12, 34, 0.9)),
                url(/img/background.jpeg) center/cover;
                min-height: 100vh;
                display: flex;
                align-items: center;
            }

            .auth-card {
                border: none;
                border-radius: 20px;
                box-shadow: 0 15px 30px rgba(0,0,0,0.3);
                backdrop-filter: blur(10px);
                background: rgba(255, 255, 255, 0.95);
                transform: translateY(0);
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .auth-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            }

            .form-control {
                border-radius: 10px;
                padding: 1.2rem;
                transition: all 0.3s ease;
                border: 2px solid #e0e0e0;
            }

            .form-control:focus {
                border-color: #4a90e2;
                box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
            }

            .form-floating label {
                padding: 0.8rem 1.2rem;
                color: #6c757d;
                transition: all 0.3s ease;
            }

            .gradient-btn {
                background: linear-gradient(135deg, #4a90e2, #3065c1);
                border: none;
                padding: 0.8rem 1.5rem;
                border-radius: 10px;
                color: white;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .gradient-btn::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                        120deg,
                        transparent,
                        rgba(255, 255, 255, 0.3),
                        transparent
                );
                transition: 0.5s;
            }

            .gradient-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
            }

            .gradient-btn:hover::before {
                left: 100%;
            }

            .switch-link {
                color: #4a90e2;
                position: relative;
                text-decoration: none;
                padding-bottom: 2px;
            }

            .switch-link::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                width: 0;
                height: 2px;
                background: #4a90e2;
                transition: width 0.3s ease;
            }

            .switch-link:hover::after {
                width: 100%;
            }

            .input-icon {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: #6c757d;
                z-index: 5;
            }
        </style>
    </head>
    <body>
    <div id="layoutAuthentication">
        <div class="auth-container">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="auth-card">
                            <div class="card-header bg-transparent text-center py-4">
                                <h2 class="fw-bold mb-0 text-primary">🏋️ 欢迎登录管理系统</h2>
                                <p class="text-muted mt-2">请使用管理员凭证登录</p>
                            </div>
                            <div class="card-body px-5 py-4">
                                <form th:action="@{/adminLogin}" method="post" name="loginForm" onsubmit="return checkSubmit(this)">
                                    <!-- 账号输入 -->
                                    <div class="form-floating mb-4 position-relative">
                                        <input class="form-control" id="inputAccount" name="adminAccount" type="text"
                                               placeholder="Account"
                                               onkeypress="return event.keyCode>=48&&event.keyCode<=57"/>
                                        <label for="inputAccount">管理员账号</label>
                                        <i class="fas fa-user input-icon"></i>
                                    </div>

                                    <!-- 密码输入 -->
                                    <div class="form-floating mb-4 position-relative">
                                        <input class="form-control" id="inputPassword" name="adminPassword" type="password"
                                               placeholder="Password"/>
                                        <label for="inputPassword">登录密码</label>
                                        <i class="fas fa-lock input-icon"></i>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="inputRememberPassword"/>
                                            <label class="form-check-label text-muted small" for="inputRememberPassword">
                                                保持登录状态
                                            </label>
                                        </div>
                                    </div>

                                    <div class="d-grid gap-3">
                                        <button type="submit" class="gradient-btn py-2">
                                            <i class="fas fa-sign-in-alt me-2"></i>立即登录
                                        </button>
                                        <div class="d-flex justify-content-center gap-3">
                                            <a class="switch-link small" th:href="@{/toAoachLogin}">
                                                <i class="fas fa-chalkboard-teacher me-1"></i>教练登录
                                            </a>
                                            <span class="text-muted">|</span>
                                            <a class="switch-link small" th:href="@{/toUserLogin}">
                                                <i class="fas fa-users me-1"></i>会员入口
                                            </a>
                                        </div>
                                    </div>
                                </form>
                                <div th:if="${msg}" class="alert alert-danger mt-4 animate__animated animate__shakeX"
                                     role="alert" th:text="${msg}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        // 增强表单验证
        function checkSubmit(loginForm) {
            const showError = (field, message) => {
                const formGroup = field.closest('.form-floating');
                formGroup.classList.add('is-invalid');
                const errorDiv = document.createElement('div');
                errorDiv.className = 'invalid-feedback animate__animated animate__shakeX';
                errorDiv.textContent = message;
                formGroup.appendChild(errorDiv);
            }

            // 清除旧错误提示
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());

            // 验证逻辑
            if (!loginForm.adminAccount.value.trim()) {
                showError(loginForm.adminAccount, '请输入管理员账号');
                loginForm.adminAccount.focus();
                return false;
            }
            if (!loginForm.adminPassword.value.trim()) {
                showError(loginForm.adminPassword, '请输入登录密码');
                loginForm.adminPassword.focus();
                return false;
            }
            return true;
        }

        // 输入框聚焦时清除错误提示
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    const formGroup = input.closest('.form-floating');
                    formGroup.classList.remove('is-invalid');
                    const errorDiv = formGroup.querySelector('.invalid-feedback');
                    if (errorDiv) {
                        errorDiv.remove();
                    }
                });
            });
        });
    </script>
    </body>
    </html>
