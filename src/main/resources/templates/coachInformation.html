<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>健身房管理系统-教练个人信息</title>
    <link href="/static/css/styles.css" th:href="@{css/styles.css}" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
<div th:replace="coachCommon::common-header"></div>
<div id="layoutSidenav">
    <div th:replace="coachCommon::common-sidenav"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">教练个人信息</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toAdminMain}">主页</a></li>
                    <li class="breadcrumb-item active">个人信息</li>
                </ol>
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-user me-1"></i>
                        个人信息
                    </div>
                    <div class="card-body">
                        <form th:action="@{/class/updateCoachInfo}" method="post">
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputAccount" name="coachAccount" type="text" placeholder="Account" th:value="${coachInfo.coachAccount}" readonly/>
                                <label for="inputAccount">账号</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputName" name="coach" type="text" placeholder="Name" th:value="${coachInfo.coach}"/>
                                <label for="inputName">姓名</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputPassword" name="coachPassword" type="password" placeholder="Password" th:value="${coachInfo.coachPassword}"/>
                                <label for="inputPassword">密码</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputClassName" name="className" type="text" placeholder="Class Name" th:value="${coachInfo.className}"/>
                                <label for="inputClassName">课程名称</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputClassBegin" name="classBegin" type="text" placeholder="Class Begin" th:value="${coachInfo.classBegin}"/>
                                <label for="inputClassBegin">开课时间</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputClassTime" name="classTime" type="text" placeholder="Class Time" th:value="${coachInfo.classTime}"/>
                                <label for="inputClassTime">课程时长</label>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                <input type="submit" class="btn btn-success" value="保存"/>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="coachCommon::common-footer"></div>
    </div>
</div>
<div th:include="coachCommon::common-scripts"></div>
</body>
</html>
