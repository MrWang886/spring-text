<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<!-- 移除重复的nav标签 -->
<nav th:replace="adminCommon::common-navbar"></nav>

<div id="layoutSidenav_content">
    <main>
        <div class="container-fluid px-4">
            <!-- 添加响应式布局容器 -->
            <div class="card shadow mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong th:text="${discussion.title}">帖子标题</strong>
                    <!-- 添加操作按钮组 -->
                    <div class="btn-group">
                        <a th:href="@{/admin/manage-comments}" class="btn btn-sm btn-secondary">返回列表</a>
                        <!-- 可扩展其他操作按钮 -->
                    </div>
                </div>
                <div class="card-body">
                    <!-- 添加信息卡片 -->
                    <div class="row">
                        <div class="col-md-8">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">作者：<span th:text="${discussion.memberName}"></span></h5>
                                    <p class="card-text" th:text="${discussion.content}"></p>
                                    <small class="text-muted">
                                        发布时间：<span th:text="${#dates.format(discussion.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                                    </small>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- 回复列表 -->
                    <div th:if="${replies != null}" class="mt-4">
                        <h5 class="mb-3">回复列表 (<span th:text="${#lists.size(replies)}">0</span>)</h5>
                        <ul class="list-group list-group-flush">
                            <li th:each="reply : ${replies}" class="list-group-item">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <strong th:text="${reply.memberName}"></strong>
                                        <small class="text-muted" th:text="${#dates.format(reply.createTime, 'yyyy-MM-dd HH:mm')}"></small>
                                    </div>
                                    <div class="btn-group">
                                        <a th:href="@{|/admin/manage-comments/view-post/${discussion.id}/delete-reply/${reply.id}|}"
                                           onclick="return confirm('确认删除此回复？')"
                                           class="btn btn-sm btn-outline-danger">
                                            删除
                                        </a>
                                    </div>
                                </div>
                                <p class="mt-2" th:text="${reply.content}"></p>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="adminCommon::common-footer"></footer>
</div>

<script th:include="adminCommon::common-scripts"></script>
</body>
</html>
