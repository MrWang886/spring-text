<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="adminCommon::common-navbar"></nav>

<div id="layoutSidenav">
    <div th:replace="adminCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <!-- 统一面包屑导航 -->
                <h1 class="mt-4">帖子详情</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toAdminMain}">管理首页</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/manage-comments}">评论管理</a></li>
                    <li class="breadcrumb-item active">帖子详情</li>
                </ol>

                <!-- 帖子内容卡片（保持与用户端一致） -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0" th:text="${discussion.title}"></h5>
                        <small class="text-muted">
                            作者：<span th:text="${discussion.memberName}"></span> &nbsp;|&nbsp;
                            发布时间：<span th:text="${#dates.format(discussion.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                        </small>
                    </div>
                    <div class="card-body">
                        <div class="discussion-content" th:text="${discussion.content}"></div>
                    </div>
                </div>

                <!-- 回复列表（样式同步） -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-comments me-1"></i>
                        回复列表（共<span th:text="${#lists.size(replies)}"></span>条）
                    </div>
                    <div class="card-body">
                        <div th:each="reply : ${replies}" class="border-bottom mb-3 pb-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <strong th:text="${reply.memberName}"></strong>
                                            <small class="text-muted" th:text="${#dates.format(reply.createTime, 'yyyy-MM-dd HH:mm')}"></small>
                                        </div>
                                    </div>
                                    <div class="mt-2" th:text="${reply.content}"></div>
                                </div>
                                <a th:href="@{'/admin/manage-comments/delete-reply/' + ${reply.id}}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('确定删除这条回复？')">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="adminCommon::common-footer"></footer>
    </div>
</div>

<!-- 公共脚本 -->
<div th:replace="adminCommon::common-scripts"></div>
</body>
</html>
