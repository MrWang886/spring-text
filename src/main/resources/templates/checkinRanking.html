<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="userCommon::common-header"></head>
<body class="sb-nav-fixed">
<div th:replace="userCommon::common-navbar"></div>
<div id="layoutSidenav">
    <div th:replace="userCommon::common-sidenav"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">打卡排行榜</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toUserMain}">主页</a></li>
                    <li class="breadcrumb-item active">打卡排行榜</li>
                </ol>
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-trophy me-1"></i>
                        排行榜
                    </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>排名</th>
                                <th>会员姓名</th>
                                <th>打卡天数</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item, iterStat : ${ranking}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${item.memberName}"></td>
                                <td th:text="${item.checkinCount}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="userCommon::common-footer"></div>
    </div>
</div>
<div th:include="userCommon::common-scripts"></div>
</body>
</html>
