<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>健身房管理系统-教练首页</title>
    <link href="/static/css/styles.css" th:href="@{css/styles.css}" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
<div th:replace="coachCommon::common-header"></div>
<div id="layoutSidenav">
    <div th:replace="coachCommon::common-sidenav"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">欢迎来到健身房管理系统</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item active">教练首页</li>
                </ol>

                <!-- 显示查询结果的区域 -->
                <div th:if="${classOrderList != null}">
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-table me-1"></i>
                            报名信息表
                        </div>
                        <div class="card-body">
                            <table id="datatablesSimple">
                                <thead>
                                <tr>
                                    <th>课程编号</th>
                                    <th>课程名称</th>
                                    <th>开课时间</th>
                                    <th>会员账号</th>
                                    <th>会员姓名</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="order:${classOrderList}">
                                    <td th:text="${order.classId}">课程编号</td>
                                    <td th:text="${order.className}">课程名称</td>
                                    <td th:text="${order.classBegin}">开课时间</td>
                                    <td th:text="${order.memberAccount}">会员账号</td>
                                    <td th:text="${order.memberName}">会员姓名</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="coachCommon::common-footer"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/static/js/scripts.js" th:src="@{/js/scripts.js}"></script>
</body>
</html>
